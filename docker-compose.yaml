services:

  mosquitto:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"
    healthcheck:
      test: [ "CMD", "mosquitto_pub", "-h", "localhost", "-p", "1883", "-i", "docker-healthcheck", "-t", "healthcheck", "-n" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./mosquitto/config:/mosquitto/config

  influxdb:
    image: influxdb:2
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: ${DOCKER_INFLUXDB_INIT_MODE}
      DOCKER_INFLUXDB_INIT_USERNAME: ${DOCKER_INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${DOCKER_INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${DOCKER_INFLUXDB_INIT_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${DOCKER_INFLUXDB_INIT_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
    healthcheck:
      test: "curl -f http://localhost:8086/ping"
      interval: 5s
      timeout: 10s
      retries: 5
    volumes:
      - ./influxdb/data:/var/lib/influxdb2
      - ./influxdb/config:/etc/influxdb2

  nodered:
    image: nodered/node-red
    ports:
      - "1880:1880"
    environment:
      NODERED_ADMIN_USERNAME: ${NODERED_ADMIN_USERNAME}
      NODERED_ADMIN_PASSWORD: ${NODERED_ADMIN_PASSWORD}
      INFLUXDB_HOST: influxdb
      INFLUXDB_MEASUREMENT: ${DOCKER_INFLUXDB_MEASUREMENT}
      INFLUXDB_INIT_ORG: ${DOCKER_INFLUXDB_INIT_ORG}
      INFLUXDB_INIT_BUCKET: ${DOCKER_INFLUXDB_INIT_BUCKET}
      INFLUXDB_TOKEN: ${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
    volumes:
      - node_red_data:/data
      - ./nodered/settings.js:/data/settings.js:ro
    depends_on:
      influxdb:
        condition: service_healthy
        restart: true
      mosquitto:
        condition: service_healthy
        restart: true

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_PATHS_CONFIG: /etc/grafana/config/custom.ini
      GRAFANA_ADMIN_USERNAME: ${GRAFANA_ADMIN_USERNAME}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      INFLUXDB_HOST: influxdb
      INFLUXDB_MEASUREMENT: ${DOCKER_INFLUXDB_MEASUREMENT}
      INFLUXDB_INIT_ORG: ${DOCKER_INFLUXDB_INIT_ORG}
      INFLUXDB_INIT_BUCKET: ${DOCKER_INFLUXDB_INIT_BUCKET}
      INFLUXDB_TOKEN: ${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/config/custom.ini:/etc/grafana/config/custom.ini:ro
    depends_on:
      influxdb:
        condition: service_healthy
        restart: true

volumes:
  grafana-data:
  node_red_data:
